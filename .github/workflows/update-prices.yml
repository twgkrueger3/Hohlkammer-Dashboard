name: Preise aktualisieren

# Fragt die Shops ab und committet data/prices.json, wenn sich etwas geändert hat.
# GitHub Pages veröffentlicht den neuen Stand danach selbst aus dem Branch main;
# dieser Workflow deployt bewusst nichts und hängt nicht von Pages ab.

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC (5:17 Uhr MEZ / 6:17 Uhr MESZ)
  workflow_dispatch:        # Knopf „Run workflow“ auf GitHub

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Bisherige Datenstände übernehmen (nur beim ersten Lauf)
        env:
          LEGACY_DATA: https://raw.githubusercontent.com/twgkrueger/Hohlkammer-Dashboard/main/data/prices.json
        run: |
          if [ -f data/prices.json ]; then
            echo "data/prices.json vorhanden, kein Import nötig."
            exit 0
          fi
          mkdir -p data
          if curl -fsSL --retry 3 "$LEGACY_DATA" -o /tmp/legacy.json \
             && python -c "import json,sys; d=json.load(open('/tmp/legacy.json')); assert d['snapshots']; print(len(d['snapshots']), 'Datenstände importiert')"; then
            mv /tmp/legacy.json data/prices.json
          else
            echo "::warning::Import der bisherigen Datenstände fehlgeschlagen, starte mit leerem Bestand."
          fi

      - name: Preise abfragen
        run: python scraper/fetch_prices.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Preise aktualisiert ($(TZ=Europe/Berlin date +%F))"
          # Falls zwischendurch jemand gepusht hat: neu aufsetzen und erneut versuchen
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
